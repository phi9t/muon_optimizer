name: Dependency Management

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.repository_owner != 'dependabot[bot]'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.13"

    - name: Update dependencies with uv
      run: |
        uv lock --upgrade

        if git diff --quiet uv.lock; then
          echo "No dependency updates available"
          exit 0
        fi

        uv sync --frozen

    - name: Run tests with updated dependencies
      run: |
        uv run pytest muon_optimizer_test.py -x -v
        uv run pytest example_usage_test.py::TestTableFunctions -v

    - name: Check for security vulnerabilities
      run: |
        uv tool run pip-audit || echo "pip-audit check completed"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: '🔄 Update dependencies'
        body: |
          ## Dependency Updates

          This PR updates the project dependencies to their latest compatible versions.

          ### Changes
          - Updated `uv.lock` with latest dependency versions
          - All tests pass with updated dependencies
          - Security check completed

          ### Testing
          - ✅ Core tests: `muon_optimizer_test.py`
          - ✅ Example tests: `example_usage_test.py`
          - ✅ Security scan completed

          ### Auto-generated
          This PR was automatically created by the dependency update workflow.
          Please review the changes and merge if appropriate.
        branch: chore/update-dependencies
        delete-branch: true
        labels: |
          dependencies
          automated
          chore

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.13"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run pip-audit
      run: |
        uv tool run pip-audit --format json --output pip-audit-report.json || true
        uv tool run pip-audit || true

    - name: Run bandit security scan
      run: |
        uv tool run bandit -r muon_optimizer.py example_usage.py -f json -o bandit-report.json || true
        uv tool run bandit -r muon_optimizer.py example_usage.py

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          pip-audit-report.json
          bandit-report.json

    - name: Create security issue if vulnerabilities found
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = '🚨 Security vulnerabilities detected';
          const body = `
          ## Security Scan Results

          The automated security scan has detected potential vulnerabilities in the codebase.

          ### Reports Generated
          - pip-audit: Dependency vulnerability scan
          - Bandit: Python code security scan

          ### Action Required
          Please review the security reports in the workflow artifacts and address any critical issues.

          **Workflow:** ${{ github.workflow }}
          **Run:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          `;

          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: 'security,automated',
            state: 'open'
          });

          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'automated', 'high-priority']
            });
          }
