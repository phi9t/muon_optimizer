name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'explorer/**'
      - 'scripts/export_explorer_data.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Install and build explorer
        working-directory: explorer
        run: npm ci && npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
