<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Muon Optimizer">
  <defs>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Orbital rings -->
  <ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.85" transform="rotate(-35 24 24)" filter="url(#glow)"/>
  <ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.85" transform="rotate(35 24 24)" filter="url(#glow)"/>
  <circle cx="11" cy="13" r="2" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="37" cy="35" r="2" fill="#22d3ee" filter="url(#glow)"/>
  <!-- Orthogonal 2x2 grid -->
  <g transform="rotate(12 24 24)">
    <rect x="13" y="13" width="10" height="10" rx="2.2" fill="url(#cellGrad)"/>
    <rect x="25" y="13" width="10" height="10" rx="2.2" fill="url(#cellGrad)" opacity="0.92"/>
    <rect x="13" y="25" width="10" height="10" rx="2.2" fill="url(#cellGrad)" opacity="0.88"/>
    <rect x="25" y="25" width="10" height="10" rx="2.2" fill="url(#cellGrad)" opacity="0.95"/>
  </g>
</svg>
